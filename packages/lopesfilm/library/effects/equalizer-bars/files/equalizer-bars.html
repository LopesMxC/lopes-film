<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Equalizer bars</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #7cf3ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Equalizer bars: A row of equalizer bars along the bottom jumping to a beat, each with a falling peak cap. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#7cf3ff');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    const n = 32, bw = w / n, base = h - 2 * u;
    for (let i = 0; i < n; i++) {
      const beat = Math.pow(Math.max(0, Math.sin(tt * 2 * Math.PI * 2)), 6);
      const v = 0.15 + 0.6 * Math.abs(Math.sin(tt * (2 + hash(i) * 5) + i)) * (0.6 + 0.4 * beat) * (1 - Math.abs(i - n / 2) / n);
      const bh = v * h * 0.32 * amount;
      const g = ctx.createLinearGradient(0, base - bh, 0, base); g.addColorStop(0, col(0.95)); g.addColorStop(1, col(0.25));
      ctx.fillStyle = g; ctx.fillRect(i * bw + bw * 0.15, base - bh, bw * 0.7, bh);
      ctx.fillStyle = col(0.9); ctx.fillRect(i * bw + bw * 0.15, base - bh - 1.4 * u, bw * 0.7, 0.5 * u);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
