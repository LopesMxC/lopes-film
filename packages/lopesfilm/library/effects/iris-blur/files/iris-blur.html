<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Iris blur</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.l { position: fixed; inset: 0; pointer-events: none; }
:root { --amount: 22; --size: 30; --feather: 40; --drift: 1; }
.l { will-change: mask-image; }
</style>
</head>
<body>
<div class="l"></div>
<script>
/*
 * Iris blur: An oval of focus that drifts gently while everything outside it melts into soft blur, like a tilt-shift or a phone portrait mode. A page of Lopes.Film's library (CC0), by Lopes. It blurs what lies beneath it (backdrop-filter);
 * what it shows at t comes from t alone, so each frame is the same in the preview and in the export.
 */
const root = document.documentElement;
const num = (n, d) => { const v = parseFloat(getComputedStyle(root).getPropertyValue(n)); return Number.isFinite(v) ? v : d; };
const el = document.querySelector('.l');
function draw(t) {
  const amount = num('--amount', 22), size = num('--size', 30), feather = num('--feather', 40), drift = num('--drift', 1);
  const cx = 50 + 6 * drift * Math.sin(t * 0.6), cy = 50 + 4 * drift * Math.cos(t * 0.45);
  const m = 'radial-gradient(ellipse ' + size * 1.3 + '% ' + size + '% at ' + cx + '% ' + cy + '%, transparent 0%, transparent 60%, #000 ' + (60 + feather * 0.4 + 0.1) + '%)';
  const s = 'blur(' + amount + 'px)';
  el.style.cssText = 'backdrop-filter: ' + s + '; -webkit-backdrop-filter: ' + s + '; -webkit-mask-image: ' + m + '; mask-image: ' + m;
}
window.film = { frame(t) { draw(t); } };
draw(0);
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
