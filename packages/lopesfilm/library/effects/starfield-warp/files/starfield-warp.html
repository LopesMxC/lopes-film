<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Warp speed</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #cfe6ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Warp speed: Stars stream out from the middle toward the edges, stretching into lines as they speed up: a jump to hyperspace. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#cfe6ff');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    const cx = w / 2, cy = h / 2, n = Math.round(260 * amount);
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = hash(i) * Math.PI * 2, life = 1.2 + hash(i + 1) * 1.6;
      const p = ((tt / life + hash(i + 2)) % 1), z = p * p * p;
      const r0 = z * Math.hypot(cx, cy) * 1.2, r1 = Math.max(0, r0 - (6 + 90 * z) * u * 0.12);
      ctx.strokeStyle = col(Math.min(1, p * 1.8)); ctx.lineWidth = 0.15 * u + z * 0.5 * u;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
