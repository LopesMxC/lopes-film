<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lightning</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #b9c8ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Lightning: Branching bolts strike from the top now and then, the whole frame flashing as each one hits. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#b9c8ff');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    const slot = Math.floor(tt * 1.3), local = tt * 1.3 - slot;
    if (hash(slot * 5.7) < 0.35 + 0.6 * amount && local < 0.35) {
      const life = 1 - local / 0.35;
      ctx.fillStyle = col(0.18 * life * (local < 0.06 ? 1 : 0.4)); ctx.fillRect(0, 0, w, h);
      const bolt = (x, y, ang, len, depth, seed) => {
        ctx.beginPath(); ctx.moveTo(x, y);
        let px = x, py = y;
        const steps = 14;
        for (let s = 1; s <= steps; s++) {
          px += Math.sin(ang) * len / steps + (hash(seed + s) - 0.5) * len * 0.12; py += Math.cos(ang) * len / steps;
          ctx.lineTo(px, py);
          if (depth < 2 && hash(seed + s * 9) > 0.86) bolt(px, py, ang + (hash(seed + s) - 0.5) * 1.4, len * 0.45, depth + 1, seed * 3 + s);
        }
        ctx.stroke();
      };
      ctx.globalCompositeOperation = 'lighter';
      for (const [lw, a] of [[1.6 * u, 0.25], [0.5 * u, 0.9]]) { ctx.lineWidth = lw; ctx.strokeStyle = col(a * life); bolt(w * (0.2 + 0.6 * hash(slot)), 0, (hash(slot + 2) - 0.5) * 0.5, h * (0.6 + 0.4 * hash(slot + 3)), 0, slot * 11); }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
