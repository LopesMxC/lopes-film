<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Electric sparks</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #ffcf6b; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Electric sparks: Bursts of hot sparks fly out from points around the frame, arcing down as they cool and fade. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#ffcf6b');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const bursts = Math.round(6 * amount + 1);
    for (let b = 0; b < bursts; b++) {
      const per = 1.4 + hash(b) * 1.2, k = Math.floor(tt / per + hash(b + 3)), p = tt / per + hash(b + 3) - k;
      const ox = w * hash(b * 7 + k), oy = h * (0.15 + 0.7 * hash(b * 5 + k + 1));
      for (let i = 0; i < 26; i++) {
        const a = hash(b * 31 + i + k) * Math.PI * 2, v = (10 + hash(i + b + k * 3) * 30) * u;
        const x = ox + Math.cos(a) * v * p, y = oy + Math.sin(a) * v * p + 40 * u * p * p;
        const x0 = ox + Math.cos(a) * v * Math.max(0, p - 0.06), y0 = oy + Math.sin(a) * v * Math.max(0, p - 0.06) + 40 * u * (p - 0.06) ** 2;
        ctx.strokeStyle = col((1 - p) * 0.95); ctx.lineWidth = 0.35 * u * (1 - p * 0.6);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
