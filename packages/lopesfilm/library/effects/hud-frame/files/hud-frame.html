<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sci-fi HUD</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #63d4ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Sci-fi HUD: A heads-up display around the frame: corner brackets, a moving scan line, ticking numbers and a pulsing target in the middle. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#63d4ff');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    ctx.globalAlpha = amount; ctx.strokeStyle = col(0.85); ctx.fillStyle = col(0.85); ctx.lineWidth = 0.3 * u;
    const m = 5 * u, L = 8 * u;
    for (const [x, y, sx, sy] of [[m, m, 1, 1], [w - m, m, -1, 1], [m, h - m, 1, -1], [w - m, h - m, -1, -1]]) { ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); }
    const sy = m + ((tt * 0.25) % 1) * (h - 2 * m); ctx.globalAlpha = 0.35 * amount; ctx.fillRect(m, sy, w - 2 * m, 0.2 * u); ctx.globalAlpha = amount;
    const pr = 3 * u + Math.sin(tt * 4) * 0.6 * u; ctx.beginPath(); ctx.arc(w / 2, h / 2, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w / 2 - pr * 2, h / 2); ctx.lineTo(w / 2 - pr * 1.2, h / 2); ctx.moveTo(w / 2 + pr * 1.2, h / 2); ctx.lineTo(w / 2 + pr * 2, h / 2); ctx.stroke();
    ctx.font = `${Math.round(1.8 * u)}px monospace`;
    ctx.fillText(`REC ${String(Math.floor(tt / 60)).padStart(2, '0')}:${String(Math.floor(tt % 60)).padStart(2, '0')}:${String(Math.floor((tt * 30) % 30)).padStart(2, '0')}`, m + 1.5 * u, m + 3 * u);
    ctx.fillText(`ALT ${(1200 + Math.sin(tt) * 80).toFixed(1)}  SPD ${(88 + Math.sin(tt * 1.7) * 6).toFixed(1)}`, m + 1.5 * u, h - m - 2 * u);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
