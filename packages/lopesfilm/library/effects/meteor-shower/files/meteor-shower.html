<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meteor shower</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #fff1c9; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Meteor shower: Shooting stars streak diagonally across the sky, each a bright head with a long fading tail. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#fff1c9');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    const n = Math.round(14 * amount);
    for (let i = 0; i < n; i++) {
      const per = 1.6 + hash(i) * 2.4, k = Math.floor(tt / per + hash(i + 7)), p = tt / per + hash(i + 7) - k;
      if (p > 0.5) continue; const q = p / 0.5;
      const x0 = w * (0.2 + hash(i * 3 + k) * 1.0), y0 = h * hash(i * 5 + k) * 0.5, len = (18 + hash(i + k) * 22) * u;
      const x = x0 - q * 50 * u, y = y0 + q * 30 * u;
      const g = ctx.createLinearGradient(x, y, x + len * 0.86, y - len * 0.5); g.addColorStop(0, col(1 - q)); g.addColorStop(1, col(0));
      ctx.strokeStyle = g; ctx.lineWidth = 0.35 * u; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len * 0.86, y - len * 0.5); ctx.stroke();
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
