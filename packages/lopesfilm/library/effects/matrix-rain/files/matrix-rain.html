<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Matrix rain</title>
<style>
  /* what a clip of it may change: its main color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #39ff88; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Matrix rain: Columns of glowing glyphs fall down the screen, the head of each one brightest, fading behind it. A page of Lopes.Film's library (CC0): everything drawn is worked out from t alone.
 */
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  return s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
};
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
function fit() {
  const d = devicePixelRatio || 1, w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}
window.film = {
  frame(t) {
    fit();
    const w = innerWidth, h = innerHeight, u = Math.min(w, h) / 100;
    const amount = Math.max(0, Math.min(1, num('--amount', 1))), speed = num('--speed', 1), c = rgb('--color', '#39ff88');
    const col = (a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    const tt = t * speed;
    ctx.font = `${Math.round(2.4 * u)}px monospace`; ctx.textBaseline = 'top';
    const step = 2.6 * u, cols = Math.ceil(w / step), rows = Math.ceil(h / step) + 1;
    const glyphs = '01アイウエオカキクケコサシスセソ<>/*+=';
    for (let i = 0; i < cols; i++) {
      if (hash(i * 3.1) > amount) continue;
      const v = 6 + hash(i) * 10, len = 8 + Math.floor(hash(i + 9) * 18);
      const head = ((tt * v + hash(i + 4) * rows * 2) % (rows + len));
      for (let k = 0; k < len; k++) {
        const r = Math.floor(head - k); if (r < 0 || r > rows) continue;
        const g = glyphs[Math.floor(hash(i * 13 + r * 7 + Math.floor(tt * 4 + k)) * glyphs.length)];
        ctx.fillStyle = k === 0 ? 'rgba(235,255,240,0.95)' : col(0.85 * (1 - k / len));
        ctx.fillText(g, i * step, r * step);
      }
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
