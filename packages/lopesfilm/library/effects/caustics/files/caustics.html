<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Caustics</title>
<style>
  /* what a clip of it may change: its color, how much of it shows (0 to 1), how fast it moves */
  :root { --color: #bff4ff; --amount: 1; --speed: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * Caustics: Rippling water light: a web of bright, ever-shifting lines like sun through the surface of a pool, two layers of it crossing and dancing over the frame.
 * A page of Lopes.Film's library (CC0), by Lopes. Drawn on the GPU by one shader, every pixel worked out from t alone,
 * so each frame comes out the same in the preview and in the export.
 */
const root = document.documentElement;
const css = (name) => getComputedStyle(root).getPropertyValue(name).trim();
const num = (name, fallback) => { const v = parseFloat(css(name)); return Number.isFinite(v) ? v : fallback; };
const probe = document.createElement('canvas').getContext('2d');
const rgb = (name, fallback) => {
  probe.fillStyle = fallback; probe.fillStyle = css(name) || fallback;
  const s = probe.fillStyle;
  const c = s[0] === '#' ? [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16)) : s.match(/[\d.]+/g).slice(0, 3).map(Number);
  return c.map((v) => v / 255);
};
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true, preserveDrawingBuffer: true, antialias: false });
const VERT = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
const FRAG = `precision highp float;
uniform vec2 R; uniform float T, AMOUNT, SPEED; uniform vec3 C1, C2;
float h11(float n) { return fract(sin(n * 127.1 + 311.7) * 43758.5453); }
float h21(vec2 p) { p = fract(p * vec2(233.34, 851.73)); p += dot(p, p + 23.45); return fract(p.x * p.y); }
vec2 h22(vec2 p) { float n = h21(p); return vec2(n, h21(p + n * 19.19)); }
float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1, 0)), f.x), mix(h21(i + vec2(0, 1)), h21(i + vec2(1, 1)), f.x), f.y); }
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; } return v; }
vec3 hue(vec3 c, float a) { const vec3 k = vec3(0.57735); float co = cos(a); return c * co + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - co); }
float cells(vec2 p, float t) {
  vec2 id = floor(p), f = fract(p);
  float d1 = 9.0, d2 = 9.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 o = vec2(float(x), float(y));
    vec2 r = h22(id + o);
    vec2 c = o + 0.5 + 0.45 * sin(t * (0.6 + r) + r * 6.28);
    float d = length(f - c);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) d2 = d;
  }
  return d2 - d1;
}
vec4 fx(vec2 uv, vec2 q, float t) {
  vec2 p = q * 4.0 + vec2(fbm(q * 2.0 + t * 0.1), fbm(q * 2.0 - t * 0.1)) * 0.8;
  float a1 = pow(1.0 - smoothstep(0.0, 0.18, cells(p, t)), 3.0);
  float a2 = pow(1.0 - smoothstep(0.0, 0.18, cells(p * 1.6 + 3.1, t * 1.3)), 3.0);
  float k = a1 * 0.75 + a2 * 0.55 + a1 * a2 * 0.8;
  return vec4(mix(C1, vec3(1.0), a1 * a2), clamp(k, 0.0, 1.0) * 0.85 * AMOUNT);
}
void main() {
  vec2 uv = gl_FragCoord.xy / R;           /* 0..1, y up */
  vec2 q = (gl_FragCoord.xy - 0.5 * R) / R.y; /* centred, height 1 */
  vec4 o = fx(uv, q, T * SPEED);
  o = clamp(o, 0.0, 1.0);
  gl_FragColor = vec4(o.rgb * o.a, o.a);
}`;
const shader = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = Object.fromEntries(['R', 'T', 'AMOUNT', 'SPEED', 'C1', 'C2'].map((n) => [n, gl.getUniformLocation(prog, n)]));
window.film = {
  frame(t) {
    const d = Math.min(devicePixelRatio || 1, 2), w = Math.round(innerWidth * d), h = Math.round(innerHeight * d);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.R, w, h); gl.uniform1f(U.T, t);
    gl.uniform1f(U.AMOUNT, Math.max(0, Math.min(1.5, num('--amount', 1))));
    gl.uniform1f(U.SPEED, num('--speed', 1));
    gl.uniform3fv(U.C1, rgb('--color', '#bff4ff'));
    gl.uniform3fv(U.C2, rgb('--color', '#bff4ff'));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { window.film.frame((performance.now() - t0) / 1000); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
