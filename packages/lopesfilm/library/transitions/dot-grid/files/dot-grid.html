<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dot grid</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
:root { --color: #1d1d22; }
</style>
</head>
<body>
<canvas></canvas>
<script>
/*
 * A grid of dots swells from the middle outward until they merge and cover the frame, then shrinks away the same way. It lasts 0.9 s and covers the cut at its middle: put its middle on the cut. A page of Lopes.Film's
 * library: what it shows at t comes from t alone, drawn in parts of the frame so it fits a stage of any shape.
 */
const D = 0.9;
const DEFAULT = '#1d1d22';
const canvas = document.querySelector('canvas');
const g = canvas.getContext('2d');
let W = 0;
let H = 0;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (u, a, b) => clamp((u - a) / (b - a));
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - (-2 * x + 2) ** 3 / 2);
const out = (x) => 1 - (1 - x) ** 3;
/* 0 until a, 1 from b to c, 0 again at d: in on [a, b], out on [c, d] */
const hold = (u, a, b, c, d) => (u < c ? seg(u, a, b) : 1 - seg(u, c, d));
const color = () => getComputedStyle(document.documentElement).getPropertyValue('--color').trim() || DEFAULT;

function draw(u) {
  const c = color(), cols = 14, s = W / cols, rows = Math.ceil(H / s) + 1;
  const maxD = Math.hypot(cols / 2, rows / 2);
  g.fillStyle = c;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const d = Math.hypot(i + 0.5 - cols / 2, j + 0.5 - rows / 2) / maxD * 0.3;
    const k = u < 0.5 ? seg(u, d, d + 0.25) : 1 - seg(u, 0.5 + d, 0.75 + d);
    const r = clamp(k) * s * 0.78;
    if (r < 0.5) continue;
    g.beginPath(); g.arc(i * s + s / 2, j * s + s / 2 - (rows * s - H) / 2, r, 0, Math.PI * 2); g.fill();
  }
}

window.film = {
  duration: D,
  frame(t) {
    const r = window.devicePixelRatio || 1;
    W = innerWidth;
    H = innerHeight;
    if (canvas.width !== Math.round(W * r) || canvas.height !== Math.round(H * r)) { canvas.width = Math.round(W * r); canvas.height = Math.round(H * r); }
    g.setTransform(r, 0, 0, r, 0, 0);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    g.filter = 'none';
    g.clearRect(0, 0, W, H);
    /* u: how far through the transition, 0 to 1; the cut is at 0.5 */
    draw(Math.min(Math.max(t / D, 0), 1));
  },
};
if (!window.filmHost) {
  const t0 = performance.now();
  const loop = () => { const t = (performance.now() - t0) / 1000; window.film.frame(window.film.duration ? t % window.film.duration : t); requestAnimationFrame(loop); };
  loop();
}
</script>
</body>
</html>
